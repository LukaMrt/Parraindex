name: Quality

on:
    # Monthly rebuild without cache: picks up base image and OS package
    # fixes even when the code does not change (trivy scan runs on the 5th).
    schedule:
        - cron: '0 4 1 * *'
    workflow_dispatch:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master, develop ]

permissions:
    contents: read

jobs:

    # ── Backend ────────────────────────────────────────────────────────────────

    backend-rector:
        name: Rector
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: curl, pdo_mysql, pdo_sqlite
            -   name: Validate composer.json
                run: composer validate --strict
            -   uses: actions/cache@v6
                with:
                    path: backend/vendor
                    key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
                    restore-keys: ${{ runner.os }}-php-
            -   run: composer install --prefer-dist --no-progress --no-scripts
            -   run: composer rector:dry

    backend-phpstan:
        name: PHPStan
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: curl, pdo_mysql, pdo_sqlite
            -   uses: actions/cache@v6
                with:
                    path: backend/vendor
                    key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
                    restore-keys: ${{ runner.os }}-php-
            -   run: composer install --prefer-dist --no-progress --no-scripts
            # Container compilé requis par phpstan-symfony et dead-code-detector (containerXmlPath)
            -   run: php bin/console cache:warmup --env=dev
            -   run: composer phpstan

    backend-phpcs:
        name: PHP-CS
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: curl, pdo_mysql, pdo_sqlite
            -   uses: actions/cache@v6
                with:
                    path: backend/vendor
                    key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
                    restore-keys: ${{ runner.os }}-php-
            -   run: composer install --prefer-dist --no-progress --no-scripts
            -   run: mkdir -p var/cache
            -   run: composer phpcs

    backend-tests:
        name: Backend Tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        services:
            mysql:
                image: mysql:9
                env:
                    # dbname_suffix "_test" (when@test) : DATABASE_NAME=parraindex -> parraindex_test
                    MYSQL_DATABASE: parraindex_test
                    MYSQL_USER: parraindex
                    MYSQL_PASSWORD: parraindex
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3
        env:
            APP_ENV: test
            APP_SECRET: ci-not-for-production
            DATABASE_HOST: 127.0.0.1
            DATABASE_PORT: 3306
            DATABASE_USER: parraindex
            DATABASE_PASSWORD: parraindex
            DATABASE_NAME: parraindex
            MAIL_USER: ci@example.com
            MAIL_PASSWORD: password
            MAIL_HOST: localhost
            MAIL_PORT: 587
            MAIL_NAME: Parraindex
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: curl, pdo_mysql, intl, gd, fileinfo, mbstring
                    coverage: none
            -   uses: actions/cache@v6
                with:
                    path: backend/vendor
                    key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
                    restore-keys: ${{ runner.os }}-php-
            -   run: composer install --prefer-dist --no-progress --no-scripts
            -   run: php bin/console doctrine:migrations:migrate --no-interaction
            -   run: php bin/console doctrine:fixtures:load --no-interaction
            -   run: php bin/phpunit --no-coverage

    backend-migrations:
        name: Migrations (up, down, no pending)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        services:
            mysql:
                image: mysql:9
                env:
                    MYSQL_DATABASE: parraindex_test
                    MYSQL_USER: parraindex
                    MYSQL_PASSWORD: parraindex
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3
        env:
            APP_ENV: dev
            APP_SECRET: ci-not-for-production
            DATABASE_HOST: 127.0.0.1
            DATABASE_PORT: 3306
            DATABASE_USER: parraindex
            DATABASE_PASSWORD: parraindex
            DATABASE_NAME: parraindex_test
            MAIL_USER: ci@example.com
            MAIL_PASSWORD: password
            MAIL_HOST: localhost
            MAIL_PORT: 587
            MAIL_NAME: Parraindex
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: curl, pdo_mysql, pdo_sqlite, intl
            -   uses: actions/cache@v6
                with:
                    path: backend/vendor
                    key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
                    restore-keys: ${{ runner.os }}-php-
            -   run: composer install --prefer-dist --no-progress --no-scripts
            -   name: Run existing migrations
                run: php bin/console doctrine:migrations:migrate --no-interaction
            # Vérifie que chaque down() est exécutable (ordre des FK, colonnes…)
            -   name: Roll back all migrations
                run: php bin/console doctrine:migrations:migrate first --no-interaction
            -   name: Re-run migrations
                run: php bin/console doctrine:migrations:migrate --no-interaction
            -   name: Validate mapping and schema
                run: php bin/console doctrine:schema:validate
            -   name: Check no pending migrations
                run: |
                    OUTPUT=$(php bin/console make:migration --no-interaction 2>&1)
                    echo "$OUTPUT"
                    echo "$OUTPUT" | grep -q "No database changes" || { echo "ERROR: Pending schema changes detected — run make:migration and commit the result."; exit 1; }

    # ── Frontend ───────────────────────────────────────────────────────────────

    frontend-format:
        name: Format
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   uses: actions/setup-node@v7
                with:
                    node-version: '24'
                    cache: 'npm'
                    cache-dependency-path: frontend/package-lock.json
            -   run: npm ci
            -   run: npm run format:check

    frontend-build:
        name: Build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   uses: actions/setup-node@v7
                with:
                    node-version: '24'
                    cache: 'npm'
                    cache-dependency-path: frontend/package-lock.json
            -   run: npm ci
            -   run: npm run build

    frontend-typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   uses: actions/setup-node@v7
                with:
                    node-version: '24'
                    cache: 'npm'
                    cache-dependency-path: frontend/package-lock.json
            -   run: npm ci
            -   run: npm run typecheck

    frontend-lint:
        name: Lint
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   uses: actions/setup-node@v7
                with:
                    node-version: '24'
                    cache: 'npm'
                    cache-dependency-path: frontend/package-lock.json
            -   run: npm ci
            -   run: npm run lint

    frontend-tests:
        name: Frontend Tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-node@v7
                with:
                    node-version: '24'
                    cache: 'npm'
                    cache-dependency-path: frontend/package-lock.json
            -   run: npm ci
            -   run: npm test -- --run

    # ── E2E ────────────────────────────────────────────────────────────────────

    e2e-format:
        name: E2E Format
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: e2e
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   uses: actions/setup-node@v7
                with:
                    node-version: '24'
                    cache: 'npm'
                    cache-dependency-path: e2e/package-lock.json
            -   run: npm ci
            -   run: npm run format:check

    e2e-lint:
        name: E2E Lint
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: e2e
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   uses: actions/setup-node@v7
                with:
                    node-version: '24'
                    cache: 'npm'
                    cache-dependency-path: e2e/package-lock.json
            -   run: npm ci
            -   run: npm run lint

    e2e-typecheck:
        name: E2E Typecheck
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: e2e
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   uses: actions/setup-node@v7
                with:
                    node-version: '24'
                    cache: 'npm'
                    cache-dependency-path: e2e/package-lock.json
            -   run: npm ci
            -   run: npm run typecheck

    e2e-tests:
        name: E2E Tests
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   name: Create .env file
                run: |
                    cat > .env <<EOF
                    DATABASE_USER=parraindex
                    DATABASE_PASSWORD=parraindex
                    DATABASE_NAME=parraindex
                    APP_SECRET=ci-test-secret-not-for-production
                    MAIL_WEB_PORT=8025
                    MAIL_SMTP_PORT=1025
                    EOF
            -   name: Start Docker stack (test target)
                run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --build
            -   name: Wait for app + mailpit
                run: |
                    timeout 120 bash -c 'until curl -sf http://localhost/ > /dev/null; do sleep 2; done'
                    timeout 30  bash -c 'until curl -sf http://localhost:8025/api/v1/messages > /dev/null; do sleep 2; done'
            -   uses: actions/setup-node@v7
                with:
                    node-version: '24'
                    cache: 'npm'
                    cache-dependency-path: e2e/package-lock.json
            -   name: Install Playwright + browsers
                working-directory: e2e
                run: |
                    npm ci
                    npx playwright install --with-deps chromium
            -   name: Run E2E tests
                working-directory: e2e
                run: npm test
            -   name: Upload Playwright report
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: playwright-report
                    path: e2e/playwright-report/
                    retention-days: 7
            -   name: Dump app logs on failure
                if: failure()
                run: docker compose -f compose.yaml -f compose.e2e.yaml logs app

    # ── Docker ─────────────────────────────────────────────────────────────────

    docker:
        name: Build & Push Docker image
        needs:
            - backend-rector
            - backend-phpstan
            - backend-phpcs
            - backend-tests
            - backend-migrations
            - frontend-format
            - frontend-build
            - frontend-typecheck
            - frontend-lint
            - frontend-tests
            - e2e-format
            - e2e-lint
            - e2e-typecheck
            - e2e-tests
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4
            -   name: Log in to GitHub Container Registry
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            -   name: Build and push
                uses: docker/build-push-action@v7
                with:
                    no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
                    context: .
                    file: docker/Dockerfile
                    target: prod
                    platforms: linux/arm64
                    push: true
                    tags: |
                        ghcr.io/lukamrt/parraindex:latest
                        ghcr.io/lukamrt/parraindex:${{ github.sha }}
